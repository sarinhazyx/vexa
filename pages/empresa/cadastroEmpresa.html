<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | VEXA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/cadastroEmpresa.css">
  <script src="../../js/cadastroEmpresa.js" defer></script>
</head>

<body>
  <main class="cadastro-container">

    <div class="marca" aria-label="VEXA">
      <svg class="simbolo-marca" viewBox="0 0 48 48" aria-hidden="true">
        <path
          d="M3 6.5C2.1 4.2 3.8 2 6.4 2h8.1c1.7 0 3.1 1 3.8 2.5l5.4 12.1 6.1-12.2C30.5 2.9 32 2 33.7 2h8c2.6 0 4.3 2.2 3.4 4.5L31 40.5c-.8 1.8-2.5 3-4.5 3h-2.2c-2 0-3.7-1.2-4.5-3L3 6.5Z"
          fill="currentColor"
        />
      </svg>
      <span>VEXA</span>
    </div>

    <header class="cabecalho">
      <h1>Criar conta</h1>
      <p class="descricao">
        Escolha o tipo de conta, preencha seus dados<br>
        e faça parte da VEXA.
      </p>
    </header>

    <div class="seletor-perfil" role="group" aria-label="Tipo de conta">
      <button
        type="button"
        class="perfil-botao"
        id="perfilFreelancer"
        aria-pressed="true"
      >
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="9" r="5.5"></circle>
          <path d="M5 28v-3.5c0-4.2 3.4-7.5 7.5-7.5h7c4.1 0 7.5 3.3 7.5 7.5V28Z"></path>
        </svg>
        <span>Sou Freelancer</span>
        <span class="perfil-check" aria-hidden="true">✓</span>
      </button>

      <button
        type="button"
        class="perfil-botao"
        id="perfilEmpresa"
        aria-pressed="false"
      >
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="4" y="8" width="24" height="21" rx="1.5"></rect>
          <path d="M11 8V4h10v4M10 13v2M16 13v2M22 13v2M10 19v2M16 19v2M22 19v2M14 29v-5h4v5"></path>
        </svg>
        <span>Sou Empresa</span>
        <span class="perfil-check" aria-hidden="true">✓</span>
      </button>
    </div>

    <form id="formCadastro">
      <div id="camposPerfil"></div>

      <button type="submit" class="botao-criar">Criar conta</button>
    </form>

    <p class="login-link">
      Já tem uma conta?
      <a id="linkLogin" href="login.html?tipo=freelancer">Entrar</a>
    </p>

    <a class="voltar" href="index.html">Voltar para a tela inicial</a>
  </main>
</body>
</html>
