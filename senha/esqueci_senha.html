<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha | VEXA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../../js/esqueciSenha.js" defer></script>
  <link rel="stylesheet" href="../../css/esqueciSenha.css">
</head>

<body>
  <main class="container">
    <header class="cabecalho">
      <div class="marca" aria-label="VEXA">
        <svg class="simbolo-marca" viewBox="0 0 49 49" aria-hidden="true">
          <path
            d="M2 4.5H13.5L24.5 27L35.5 4.5H47L30 39.5C28.8 42 26.8 43.5 24.5 43.5C22.2 43.5 20.2 42 19 39.5L2 4.5Z"
            fill="currentColor"
          />
        </svg>
        <span>VEXA</span>
      </div>

      <p class="marca-descricao">Conectando talentos e oportunidades</p>
    </header>

    <section class="card">
      <div class="icone-cadeado" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="4" y="10" width="16" height="11" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
      </div>

      <h2>Esqueci minha senha</h2>

      <p class="descricao">
        Informe seu e-mail cadastrado e enviaremos um link para você redefinir sua senha.
      </p>

      <form id="formRecuperacao">
        <div class="campo">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="seuemail@exemplo.com"
            autocomplete="email"
            required
          >
        </div>

        <button type="submit" class="botao">
          Enviar link de recuperação
        </button>
      </form>

      <a class="voltar-login" id="linkLogin" href="login.html?tipo=freelancer">
        <span class="seta" aria-hidden="true">←</span>
        Voltar para o login
      </a>
    </section>
  </main>
</body>
</html>
